name: save-feedback-red
on:
  push:
    branches: [upload/nexbar2-final]
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wip/nexbar2-v1
      - name: Confirm save feedback contract fails before implementation
        run: python3 -m unittest public.nexbar.tests.test_control_save_feedback -v
