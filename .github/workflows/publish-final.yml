name: browser-green
on:
  push:
    branches: [upload/nexbar2-final]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wip/nexbar2-v1
      - name: Verify browser regressions
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          npm test
          npx playwright test
