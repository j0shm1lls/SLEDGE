name: direction-refresh-red
on:
  push:
    branches: [upload/nexbar2-final]
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wip/nexbar2-v1
      - name: Confirm regressions fail before implementation
        run: |
          set -euo pipefail
          python3 -m unittest public.nexbar.tests.test_direction_contract -v
          npm test
