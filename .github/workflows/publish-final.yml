name: sledge-legacy-name-red
on:
  push:
    branches: [upload/nexbar2-final]
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wip/sledge-v1
      - name: Confirm docs reject legacy branding
        run: python3 -m unittest public.sledge.tests.test_rebrand_docs -v
