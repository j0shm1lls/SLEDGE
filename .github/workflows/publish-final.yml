name: save-feedback-verify
on:
  push:
    branches: [upload/nexbar2-final]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wip/nexbar2-v1
      - name: Verify committed save feedback state
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          python3 -m unittest discover -s public/nexbar/tests -p 'test_*.py' -v
          npm test
          npm run typecheck
          npm run build
          git restore --source=HEAD --worktree --staged .output src/routeTree.gen.ts 2>/dev/null || true
          python3 -m py_compile public/nexbar/nexbar-bridge.py
          unzip -t public/nexbar/nexbar.zip
          git diff --check
