name: mobile-overflow-diagnostic
on:
  push:
    branches: [upload/nexbar2-final]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wip/nexbar2-v1
      - name: Measure remaining mobile overflow
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          npm run dev > /tmp/nexbar-dev.log 2>&1 &
          DEV_PID=$!
          trap 'kill "$DEV_PID" 2>/dev/null || true; rm -f .diag.mjs' EXIT
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/ >/dev/null && break
            sleep 1
          done
          cat > .diag.mjs <<'JS'
          import { chromium } from 'playwright'
          const browser = await chromium.launch({ headless: true })
          const page = await browser.newPage({ viewport: { width: 390, height: 844 } })
          await page.goto('http://127.0.0.1:8080/', { waitUntil: 'networkidle' })
          const data = await page.evaluate(() => {
            const cw = document.documentElement.clientWidth
            const sw = document.documentElement.scrollWidth
            const offenders = [...document.querySelectorAll('*')].map(el => {
              const r = el.getBoundingClientRect()
              const cs = getComputedStyle(el)
              return {
                tag: el.tagName.toLowerCase(), cls: el.className?.toString?.() || '',
                text: (el.textContent || '').trim().replace(/\s+/g,' ').slice(0,120),
                left: +r.left.toFixed(1), right: +r.right.toFixed(1), width: +r.width.toFixed(1),
                scrollWidth: el.scrollWidth, clientWidth: el.clientWidth,
                overflowX: cs.overflowX, minWidth: cs.minWidth, whiteSpace: cs.whiteSpace,
              }
            }).filter(x => x.right > cw + .5 || x.left < -.5 || x.scrollWidth > x.clientWidth + 1)
              .sort((a,b) => Math.max(b.right-cw,b.scrollWidth-b.clientWidth)-Math.max(a.right-cw,a.scrollWidth-a.clientWidth))
              .slice(0,40)
            return { clientWidth:cw, scrollWidth:sw, offenders }
          })
          console.log(JSON.stringify(data,null,2))
          await browser.close()
          JS
          node .diag.mjs
