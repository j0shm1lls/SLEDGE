name: integrate-nollie-cdc
on:
  push:
    branches: [upload/nexbar2-final]
permissions:
  contents: write
jobs:
  cdc-red-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate CDC patch with an explicit red-green gate
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .bootstrap/cdc-test.patch ] || [ ! -f .bootstrap/cdc-code.patch ]; then
            echo 'CDC patches not both staged yet; nothing to integrate.'
            exit 0
          fi
          cp .bootstrap/cdc-test.patch /tmp/cdc-test.patch
          cp .bootstrap/cdc-code.patch /tmp/cdc-code.patch
          git fetch origin wip/nexbar2-v1
          git checkout -B cdc-work origin/wip/nexbar2-v1
          git apply /tmp/cdc-test.patch

          set +e
          python3 -m unittest public/nexbar/tests/test_nollie_cdc.py -v >/tmp/cdc-red.log 2>&1
          red_rc=$?
          set -e
          cat /tmp/cdc-red.log
          if [ "$red_rc" -eq 0 ]; then
            echo 'Expected CDC regression test to fail before implementation, but it passed.' >&2
            exit 1
          fi
          grep -q "has no attribute 'NollieCdc'" /tmp/cdc-red.log
          echo 'Observed expected RED: CDC backend does not exist yet.'

          git apply /tmp/cdc-code.patch
          python3 -m unittest public/nexbar/tests/test_nollie_cdc.py -v
          python3 -m unittest discover -s public/nexbar/tests -p 'test_*.py' -v
          python3 -m py_compile public/nexbar/nexbar-bridge.py
          node scripts/build-nexbar-zip.mjs
          unzip -t public/nexbar/nexbar.zip
          git diff --check

          git config user.name "nexbar2-build"
          git config user.email "actions@users.noreply.github.com"
          git add public/nexbar
          git commit -m "feat: support Nollie1 CDC serial backend"
          git push origin HEAD:wip/nexbar2-v1
